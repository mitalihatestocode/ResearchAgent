<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1010" width="1100" height="1010" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .s { font-size: 11.5px; fill: #424242; }
      .g { font-size: 12px; font-weight: 700; letter-spacing: .5px; }
      .tool { font-size: 12.5px; font-weight: 700; fill: #1a1a1a; font-family: Menlo, Consolas, monospace; }
      .ts { font-size: 10.5px; fill: #555; }
      .e { stroke: #455a64; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .d { stroke: #78909c; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1100" height="1010" fill="#ffffff"/>
  <text x="550" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">ResearchAgent — Agent Architecture</text>
  <text x="550" y="52" text-anchor="middle" class="s">guardrails → plan → resolve → execute tools → observe &amp; self-correct → verified, labelled output</text>

  <!-- User / UI -->
  <rect x="380" y="68" width="340" height="52" rx="26" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="550" y="91" text-anchor="middle" class="t">User · Streamlit UI</text>
  <text x="550" y="108" text-anchor="middle" class="s">sign-in · upload · chat · trace · galaxy · report</text>

  <!-- Input guardrails -->
  <rect x="380" y="146" width="340" height="54" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="550" y="169" text-anchor="middle" class="t">Input guardrails</text>
  <text x="550" y="187" text-anchor="middle" class="s">patterns + Prompt Guard 2 (ML) · misuse · file checks</text>
  <path class="e" d="M550,120 L550,144"/>

  <!-- Planner + resolver -->
  <rect x="200" y="232" width="320" height="72" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="360" y="256" text-anchor="middle" class="t">Planner (LLM)</text>
  <text x="360" y="274" text-anchor="middle" class="s">few-shot prompt + tool registry descriptions</text>
  <text x="360" y="291" text-anchor="middle" class="s">→ intent · target papers · tool plan + reasons</text>

  <rect x="580" y="232" width="320" height="72" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="740" y="256" text-anchor="middle" class="t">Dependency resolver</text>
  <text x="740" y="274" text-anchor="middle" class="s">auto-adds prerequisites · verification policy</text>
  <text x="740" y="291" text-anchor="middle" class="s">scope self-check (can override the planner)</text>
  <path class="e" d="M550,200 L550,216 L360,216 L360,230"/>
  <path class="e" d="M520,268 L578,268"/>

  <!-- Orchestrator -->
  <rect x="200" y="338" width="700" height="62" rx="8" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.8"/>
  <text x="550" y="362" text-anchor="middle" class="t">Orchestrator — agent loop</text>
  <text x="550" y="382" text-anchor="middle" class="s">execute → observe → self-correct (re-search if answer incomplete) · trace · memory · saved analyses · parallel calls</text>
  <path class="e" d="M740,304 L740,336"/>

  <!-- Tools container -->
  <rect x="30" y="432" width="1040" height="262" rx="12" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="48" y="453" class="g" fill="#616161">TOOL REGISTRY · 9 TOOLS (planner selects by description)</text>
  <path class="e" d="M550,400 L550,430"/>

  <!-- Knowledge tools -->
  <rect x="48" y="466" width="300" height="214" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="62" y="486" class="g" fill="#2e7d32">KNOWLEDGE (RAG)</text>
  <rect x="62" y="496" width="272" height="50" rx="6" fill="#fff" stroke="#81c784"/>
  <text x="74" y="516" class="tool">extract_metadata</text>
  <text x="74" y="534" class="ts">title · authors · year (LLM, first page)</text>
  <rect x="62" y="554" width="272" height="50" rx="6" fill="#fff" stroke="#81c784"/>
  <text x="74" y="574" class="tool">analyze_papers</text>
  <text x="74" y="592" class="ts">8 targeted retrievals → structured fields + pages</text>
  <rect x="62" y="612" width="272" height="56" rx="6" fill="#fff" stroke="#81c784"/>
  <text x="74" y="632" class="tool">rag_retrieval</text>
  <text x="74" y="649" class="ts">hybrid search · relevance threshold ·</text>
  <text x="74" y="662" class="ts">LLM query rewrite when evidence is weak</text>

  <!-- Reasoning tools -->
  <rect x="364" y="466" width="372" height="214" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.2"/>
  <text x="378" y="486" class="g" fill="#5e35b1">REASONING</text>
  <rect x="378" y="496" width="168" height="62" rx="6" fill="#fff" stroke="#9575cd"/>
  <text x="388" y="516" class="tool">answer_question</text>
  <text x="388" y="533" class="ts">grounded answer with</text>
  <text x="388" y="547" class="ts">[S#] page citations</text>
  <rect x="556" y="496" width="166" height="62" rx="6" fill="#fff" stroke="#9575cd"/>
  <text x="566" y="516" class="tool">verify_answer</text>
  <text x="566" y="533" class="ts">LLM judge + citation</text>
  <text x="566" y="547" class="ts">check → 1 revision</text>
  <path d="M556,548 C530,576 500,576 470,560" stroke="#c62828" stroke-width="1.5" fill="none" marker-end="url(#arrowR)"/>
  <text x="463" y="584" class="ts" fill="#c62828">reflection loop</text>
  <rect x="378" y="594" width="168" height="74" rx="6" fill="#fff" stroke="#9575cd"/>
  <text x="388" y="614" class="tool">compare_papers</text>
  <text x="388" y="631" class="ts">deterministic table +</text>
  <text x="388" y="645" class="ts">AI similarities/differences</text>
  <rect x="556" y="594" width="166" height="74" rx="6" fill="#fff" stroke="#9575cd"/>
  <text x="566" y="614" class="tool">identify_</text>
  <text x="566" y="628" class="tool">research_gaps</text>
  <text x="566" y="645" class="ts">from author-reported</text>
  <text x="566" y="659" class="ts">limitations + differences</text>

  <!-- Action tools -->
  <rect x="752" y="466" width="300" height="214" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.2"/>
  <text x="766" y="486" class="g" fill="#e65100">ACTION · EXTERNAL</text>
  <rect x="766" y="496" width="272" height="72" rx="6" fill="#fff" stroke="#ffb74d"/>
  <text x="778" y="516" class="tool">search_related_work</text>
  <text x="778" y="534" class="ts">arXiv → OpenAlex fallback</text>
  <text x="778" y="549" class="ts">prior-work check for every research gap</text>
  <text x="778" y="562" class="ts">(novelty claims verified against literature)</text>
  <rect x="766" y="578" width="272" height="90" rx="6" fill="#fff" stroke="#ffb74d"/>
  <text x="778" y="598" class="tool">generate_report</text>
  <text x="778" y="616" class="ts">deterministic Markdown assembly</text>
  <text x="778" y="631" class="ts">every section labelled: reported by authors /</text>
  <text x="778" y="645" class="ts">AI-generated / potential direction / external</text>
  <text x="778" y="659" class="ts">→ downloadable .md report</text>

  <!-- Infrastructure row -->
  <rect x="30" y="730" width="560" height="150" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="48" y="752" class="g" fill="#2e7d32">KNOWLEDGE LAYER (built once, saved per user account)</text>
  <rect x="48" y="766" width="150" height="96" rx="6" fill="#fff" stroke="#81c784"/>
  <text x="123" y="788" text-anchor="middle" class="t" font-size="13">PDF extraction</text>
  <text x="123" y="806" text-anchor="middle" class="ts">pdfplumber</text>
  <text x="123" y="820" text-anchor="middle" class="ts">2-column aware</text>
  <text x="123" y="834" text-anchor="middle" class="ts">ligature/hyphen fix</text>
  <text x="123" y="848" text-anchor="middle" class="ts">injection scan</text>
  <rect x="218" y="766" width="150" height="96" rx="6" fill="#fff" stroke="#81c784"/>
  <text x="293" y="788" text-anchor="middle" class="t" font-size="13">Chunking</text>
  <text x="293" y="806" text-anchor="middle" class="ts">sentence-aware, overlap</text>
  <text x="293" y="820" text-anchor="middle" class="ts">section-tagged</text>
  <text x="293" y="834" text-anchor="middle" class="ts">references skipped</text>
  <text x="293" y="848" text-anchor="middle" class="ts">page metadata kept</text>
  <rect x="388" y="766" width="186" height="96" rx="6" fill="#fff" stroke="#81c784"/>
  <text x="481" y="788" text-anchor="middle" class="t" font-size="13">Hybrid index</text>
  <text x="481" y="806" text-anchor="middle" class="ts">FAISS · MiniLM-L6 embeddings</text>
  <text x="481" y="820" text-anchor="middle" class="ts">+ BM25 keyword index</text>
  <text x="481" y="834" text-anchor="middle" class="ts">fused by Reciprocal Rank</text>
  <text x="481" y="848" text-anchor="middle" class="ts">Fusion (RRF)</text>
  <path class="e" d="M198,814 L216,814"/>
  <path class="e" d="M368,814 L386,814"/>

  <rect x="610" y="730" width="215" height="150" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="717" y="760" text-anchor="middle" class="t">Groq LLM API</text>
  <text x="717" y="782" text-anchor="middle" class="ts">gpt-oss-20b + gpt-oss-120b</text>
  <text x="717" y="797" text-anchor="middle" class="ts">load-balanced (rate limits)</text>
  <text x="717" y="816" text-anchor="middle" class="ts">JSON mode · Retry-After</text>
  <text x="717" y="831" text-anchor="middle" class="ts">aware retries · key redaction</text>
  <text x="717" y="850" text-anchor="middle" class="ts">per-task temperature</text>
  <text x="717" y="865" text-anchor="middle" class="ts">usage &amp; latency tracking</text>

  <rect x="845" y="730" width="225" height="150" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="957" y="760" text-anchor="middle" class="t">Scholarly APIs</text>
  <text x="957" y="782" text-anchor="middle" class="ts">arXiv API (Atom XML)</text>
  <text x="957" y="797" text-anchor="middle" class="ts">OpenAlex API (JSON)</text>
  <text x="957" y="816" text-anchor="middle" class="ts">free · no key · timeouts</text>
  <text x="957" y="831" text-anchor="middle" class="ts">only short keyword</text>
  <text x="957" y="846" text-anchor="middle" class="ts">queries leave the machine</text>

  <path class="d" d="M198,668 L198,728"/>
  <path class="d" d="M650,694 L700,728"/>
  <path class="d" d="M902,680 L930,728"/>

  <!-- Output guardrails -->
  <rect x="200" y="916" width="700" height="62" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="550" y="940" text-anchor="middle" class="t">Output guardrails &amp; transparency</text>
  <text x="550" y="960" text-anchor="middle" class="s">overclaim softening · XSS-safe rendering · source labels · verification badge</text>
  <path class="e" d="M1062,694 L1085,694 L1085,947 L902,947"/>
  <path class="e" d="M200,947 L14,947 L14,94 L378,94"/>
  <text x="28" y="520" class="ts" transform="rotate(-90 28 520)">final answer · report · trace → user</text>
</svg>

[server]
address = "localhost"      # only reachable from this computer
maxUploadSize = 25         # MB
fileWatcherType = "none"
enableXsrfProtection = true

[client]
showErrorDetails = "none"  # no stack traces for users
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#007AFF"
backgroundColor = "#F2F2F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C1C1E"
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"
baseRadius = "12px"
buttonRadius = "full"
showWidgetBorder = false

[logger]
hideWelcomeMessage = true  # also hides Streamlit's own "install skills" pop-up
